<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beingadot. | Links</title>
  <meta name="description" content="Beingadot. marketing and edtech links in one premium, mobile-friendly page." />
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-1: #fffaf6;
      --bg-2: #f6f1ff;
      --bg-3: #eef8ff;
      --card: rgba(255, 255, 255, 0.76);
      --stroke: rgba(255, 255, 255, 0.9);
      --shadow: 0 18px 40px rgba(125, 102, 179, 0.18);
      --text: #1d1630;
      --muted: #665b7a;
      --brand-1: #7c3aed;
      --brand-2: #ff7a59;
      --brand-3: #14b8a6;
      --dark-pill: #171320;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Gilroy", "Montserrat", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 15%, rgba(255, 122, 89, 0.18), transparent 28%),
        radial-gradient(circle at 80% 15%, rgba(124, 58, 237, 0.16), transparent 24%),
        radial-gradient(circle at 50% 48%, rgba(20, 184, 166, 0.10), transparent 32%),
        linear-gradient(180deg, var(--bg-3) 0%, var(--bg-1) 42%, var(--bg-2) 100%);
      background-attachment: fixed;
    }

    .glass {
      background: var(--card);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.75);
      box-shadow: var(--shadow);
    }

    .profile-ring {
      background: linear-gradient(135deg, var(--brand-2), var(--brand-1), #4f9cff);
      padding: 5px;
      box-shadow: 0 18px 40px rgba(79, 156, 255, 0.18), 0 8px 20px rgba(124, 58, 237, 0.12);
    }

    .social-btn,
    .floating-btn {
      transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
    }

    .social-btn:hover,
    .link-card:hover,
    .floating-btn:hover {
      transform: translateY(-2px);
    }

    .social-btn:hover,
    .floating-btn:hover {
      box-shadow: 0 12px 24px rgba(30, 22, 48, 0.14);
    }

    .link-card {
      transition: transform 0.22s ease, box-shadow 0.22s ease, border-color 0.22s ease;
      border: 1px solid rgba(255, 255, 255, 0.85);
    }

    .link-card:hover {
      box-shadow: 0 22px 48px rgba(100, 79, 150, 0.18);
      border-color: rgba(124, 58, 237, 0.18);
    }

    .cta-btn {
      background: linear-gradient(135deg, #171320, #251d34);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .cta-btn:hover {
      transform: scale(1.01);
      filter: brightness(1.05);
    }

    .thumb {
      width: 74px;
      height: 74px;
      min-width: 74px;
      border-radius: 22px;
      object-fit: cover;
      box-shadow: 0 10px 24px rgba(86, 62, 134, 0.16);
    }

    .social-icon {
      width: 52px;
      height: 52px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: #1d1727;
      color: #fff;
      border: 3px solid rgba(255, 255, 255, 0.92);
      box-shadow: 0 10px 24px rgba(50, 42, 74, 0.12);
    }

    .mini-pill {
      background: rgba(255,255,255,0.78);
      border: 1px solid rgba(255,255,255,0.95);
      box-shadow: 0 10px 24px rgba(70, 56, 103, 0.14);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .brand-gradient-1 {
      color: var(--brand-1);
    }

    .brand-gradient-2 {
      color: var(--brand-2);
    }

    .soft-line {
      background: linear-gradient(90deg, transparent, rgba(124,58,237,0.18), transparent);
      height: 1px;
    }

    @media (max-width: 420px) {
      .thumb {
        width: 66px;
        height: 66px;
        min-width: 66px;
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
  <main class="min-h-screen px-4 py-6 sm:py-8">
    <section class="mx-auto w-full max-w-[460px]">
      <div class="mb-6 flex items-center justify-between gap-3">
        <button id="subscribeBtn" class="floating-btn mini-pill inline-flex items-center gap-2 rounded-full px-4 py-2.5 text-sm font-semibold text-[#20182d]">
          <span aria-hidden="true">✦</span>
          <span>Subscribe</span>
        </button>
        <button id="shareBtn" class="floating-btn mini-pill inline-flex h-11 w-11 items-center justify-center rounded-full text-[#20182d]" aria-label="Share page">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4"></path>
            <path d="M7 9l5-5 5 5"></path>
            <path d="M5 20h14"></path>
          </svg>
        </button>
      </div>

      <div class="text-center">
        <div class="profile-ring mx-auto mb-6 inline-flex rounded-full">
          <img
            src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=600&q=80"
            alt="Beingadot profile"
            class="h-44 w-44 rounded-full border-[7px] border-white object-cover sm:h-48 sm:w-48"
          />
        </div>

        <h1 class="text-[2.4rem] font-extrabold leading-none tracking-tight text-[#171320] sm:text-[2.75rem]">
          <span class="brand-gradient-1">Being</span><span class="brand-gradient-2">a</span><span class="brand-gradient-1">dot.</span>
        </h1>

        <div class="mt-3 flex items-center justify-center gap-2">
          <span class="inline-flex items-center rounded-full bg-white/80 px-3 py-1 text-xs font-semibold uppercase tracking-[0.22em] text-[#6b5c86] shadow-sm">Marketing • EdTech</span>
        </div>

        <p class="mx-auto mt-4 max-w-[340px] text-[15px] leading-6 text-[var(--muted)] sm:text-base">
          Smart learning, premium strategy, and simple links — all in one clean mobile-first experience.
        </p>

        <p class="mt-3 text-sm font-semibold tracking-[0.18em] text-[#8c7ca8] uppercase">Build • Learn • Grow</p>
      </div>

      <div class="mt-7 flex flex-wrap items-center justify-center gap-3 sm:gap-4">
        <a class="social-btn social-icon" href="https://instagram.com" target="_blank" rel="noreferrer" aria-label="Instagram">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2.5" y="2.5" width="19" height="19" rx="5"></rect>
            <circle cx="12" cy="12" r="4.2"></circle>
            <circle cx="18" cy="6" r="1"></circle>
          </svg>
        </a>
        <a class="social-btn social-icon" href="https://wa.me/910000000000" target="_blank" rel="noreferrer" aria-label="WhatsApp">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M20.52 3.48A11.86 11.86 0 0 0 12.09 0C5.54 0 .2 5.33.2 11.88c0 2.1.55 4.15 1.6 5.96L0 24l6.35-1.67a11.84 11.84 0 0 0 5.74 1.46h.01c6.55 0 11.9-5.33 11.9-11.88 0-3.17-1.23-6.15-3.48-8.43Zm-8.43 18.3h-.01a9.8 9.8 0 0 1-5-1.37l-.36-.21-3.77.99 1.01-3.67-.24-.38a9.83 9.83 0 0 1-1.51-5.25C2.21 6.45 6.66 2 12.1 2c2.61 0 5.06 1.01 6.91 2.87a9.72 9.72 0 0 1 2.87 6.92c0 5.44-4.44 9.89-9.79 9.99Zm5.42-7.39c-.3-.15-1.77-.87-2.04-.97-.27-.1-.47-.15-.66.15-.2.3-.76.97-.94 1.17-.17.2-.34.22-.64.07-.3-.15-1.25-.46-2.38-1.47-.88-.78-1.47-1.74-1.64-2.04-.17-.3-.02-.46.13-.61.14-.14.3-.34.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.23-.24-.58-.48-.5-.66-.5h-.56c-.2 0-.52.07-.8.37-.27.3-1.05 1.03-1.05 2.5 0 1.47 1.08 2.89 1.23 3.09.15.2 2.11 3.23 5.1 4.53.71.31 1.27.49 1.71.63.72.23 1.38.2 1.9.12.58-.09 1.77-.72 2.02-1.42.25-.69.25-1.29.17-1.42-.07-.12-.27-.2-.57-.34Z"></path>
          </svg>
        </a>
        <a class="social-btn social-icon" href="https://forms.google.com" target="_blank" rel="noreferrer" aria-label="Google Form">
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <path d="M14 2v6h6"></path>
            <path d="M8 13h1"></path>
            <path d="M8 17h1"></path>
            <path d="M12 13h4"></path>
            <path d="M12 17h4"></path>
          </svg>
        </a>
        <a class="social-btn social-icon" href="https://linkedin.com" target="_blank" rel="noreferrer" aria-label="LinkedIn">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M6.94 8.5H3.56V20h3.38V8.5ZM5.25 3A1.97 1.97 0 1 0 5.3 6.94 1.97 1.97 0 0 0 5.25 3ZM20.44 12.41c0-3.2-1.71-4.69-4-4.69a3.48 3.48 0 0 0-3.13 1.72V8.5H9.94c.04.62 0 11.5 0 11.5h3.37v-6.42c0-.34.03-.69.13-.93.27-.68.88-1.38 1.9-1.38 1.35 0 1.88 1.03 1.88 2.54V20h3.38v-7.59Z"></path>
          </svg>
        </a>
        <a class="social-btn social-icon" href="mailto:hello@beingadot.com" aria-label="Email">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="14" rx="2"></rect>
            <path d="m4 7 8 6 8-6"></path>
          </svg>
        </a>
      </div>

      <div class="my-7 soft-line w-full"></div>

      <div id="linksContainer" class="space-y-5"></div>

      <footer class="pb-5 pt-8 text-center">
        <p class="text-xs font-medium tracking-[0.18em] text-[#8f81ab] uppercase">Minimal • Premium • Fast</p>
      </footer>
    </section>
  </main>

  <script>
    const linkData = [
      {
        title: "Free Marketing Templates",
        description: "Grab premium ready-to-use templates for campaigns, content, and funnels.",
        action: "Open Google Form",
        href: "https://forms.google.com",
        image: "https://images.unsplash.com/photo-1516321318423-f06f85e504b3?auto=format&fit=crop&w=300&q=80",
        accent: "linear-gradient(135deg, rgba(124,58,237,0.18), rgba(255,122,89,0.18))"
      },
      {
        title: "Book a Strategy Call",
        description: "Private 1:1 session for branding, marketing systems, and education growth.",
        action: "Book on WhatsApp",
        href: "https://wa.me/910000000000",
        image: "https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=300&q=80",
        accent: "linear-gradient(135deg, rgba(20,184,166,0.18), rgba(124,58,237,0.12))"
      },
      {
        title: "Join Our Learning Circle",
        description: "Explore programs, updates, resources, and fresh ideas from Beingadot.",
        action: "Visit Main Link",
        href: "https://example.com",
        image: "https://images.unsplash.com/photo-1513258496099-48168024aec0?auto=format&fit=crop&w=300&q=80",
        accent: "linear-gradient(135deg, rgba(255,122,89,0.16), rgba(255,255,255,0.2))"
      }
    ];

    const linksContainer = document.getElementById('linksContainer');

    linksContainer.innerHTML = linkData.map((item, index) => `
      <a
        href="${item.href}"
        target="_blank"
        rel="noreferrer"
        class="link-card glass block rounded-[2rem] p-4 sm:p-5"
        style="background-image:${item.accent};"
      >
        <div class="flex items-start gap-4">
          <img src="${item.image}" alt="${item.title}" class="thumb" />
          <div class="min-w-0 flex-1 pt-1">
            <h2 class="truncate text-[1.35rem] font-bold leading-tight text-[#1a1327] sm:text-[1.55rem]">${item.title}</h2>
            <p class="mt-2 text-[15px] leading-6 text-[#5f5376] sm:text-base">${item.description}</p>
          </div>
        </div>
        <div class="mt-4 rounded-full cta-btn px-5 py-4 text-center text-lg font-bold text-white shadow-[0_14px_30px_rgba(28,22,40,0.22)]">
          ${item.action}
        </div>
      </a>
    `).join('');

    const shareBtn = document.getElementById('shareBtn');
    const subscribeBtn = document.getElementById('subscribeBtn');

    shareBtn.addEventListener('click', async () => {
      const shareData = {
        title: 'Beingadot.',
        text: 'Check out Beingadot. — marketing and edtech links.',
        url: window.location.href
      };

      try {
        if (navigator.share) {
          await navigator.share(shareData);
        } else {
          await navigator.clipboard.writeText(window.location.href);
          shareBtn.innerHTML = '✓';
          setTimeout(() => {
            shareBtn.innerHTML = `
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 16V4"></path>
                <path d="M7 9l5-5 5 5"></path>
                <path d="M5 20h14"></path>
              </svg>`;
          }, 1600);
        }
      } catch (error) {
        console.log('Share cancelled or unavailable', error);
      }
    });

    subscribeBtn.addEventListener('click', () => {
      const firstCard = document.querySelector('.link-card');
      if (firstCard) {
        firstCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        firstCard.animate(
          [
            { transform: 'scale(1)', boxShadow: '0 18px 40px rgba(125, 102, 179, 0.18)' },
            { transform: 'scale(1.015)', boxShadow: '0 24px 48px rgba(124, 58, 237, 0.22)' },
            { transform: 'scale(1)', boxShadow: '0 18px 40px rgba(125, 102, 179, 0.18)' }
          ],
          { duration: 550, easing: 'ease-out' }
        );
      }
    });
  </script>
</body>
</html>
